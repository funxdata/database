[package]
name = "database"
version = "0.1.0"
edition = "2021"

# 核心：指定编译为 动态库 + C ABI 兼容
[lib]
crate-type = ["cdylib"]  # ✅ 关键：生成 .so/.dll/.dylib
name = "database"        # 输出库名：librust_lib.so / rust_lib.dll

[dependencies]
chrono = "0.4.45"
flate2 = "1.1.9"
# 跨语言类型安全（推荐必装）
libc = "0.2"             # C 基础类型
once_cell = "1.19"       # 全局初始化
serde = { version = "1.0", features = ["derive"] }
serde_derive = "1.0"
serde_json = "1.0"
uuid = { version = "1.23.2", features = ["v4"] }
rusqlite = { version = "0.37", features = ["bundled"] }
safer-ffi = "0.1.13"

