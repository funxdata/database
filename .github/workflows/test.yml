name: Test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Check Rust formatting
        run: cargo fmt --check

      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run Rust tests
        run: cargo test --all-targets

      - name: Build release library
        run: cargo build --release

      - name: Verify exported symbols
        run: |
          set -euo pipefail
          actual=$(nm -D --defined-only target/release/libdatabase.so | awk '{print $3}' | grep '^db_' | sort)
          expected=$(printf 'db_create\ndb_delete\ndb_insert\ndb_query\ndb_update')
          if [ "$actual" != "$expected" ]; then
            echo "unexpected exported symbols:" >&2
            echo "$actual" >&2
            exit 1
          fi

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Check Deno formatting
        working-directory: ts
        run: deno fmt --check

      - name: Lint Deno FFI client
        working-directory: ts
        run: deno lint

      - name: Type-check Deno FFI client
        working-directory: ts
        run: deno task check

      - name: Run Deno FFI tests
        working-directory: ts
        run: deno task test

      - name: Run Deno smoke tests
        working-directory: ts
        run: deno task smoke
