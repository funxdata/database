[package]
name = "database"
version = "1.0.5"
edition = "2021"

# 核心：动态库 + C ABI，同时保留 rlib 供测试引用
[lib]
crate-type = ["cdylib", "rlib"]
name = "database"        # 产物：database.dll / libdatabase.so / libdatabase.dylib

[[test]]
name = "units_ffi"
path = "units/ffi_test.rs"

[[test]]
name = "units_cjson"
path = "units/cjson_test.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.37", features = ["bundled"] }
safer-ffi = "0.1.13"
